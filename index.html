<!doctype html>
<html lang="mg">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="theme-color" content="#1f5e3b">
        <link rel="manifest" href="manifest.json">
        <link rel="icon" href="icon.svg">
        <title>SPG Ronono – Mpitsirika</title>
        <style>
            :root {
                --g: #1f5e3b;
                --bg: #f4f7f4;
                --c: #fff;
                --ink: #18231c;
                --mu: #5d6b62;
                --ln: #d5ddd6;
                --ok: #1f7a45;
                --nc: #b3261e
            }

            @media(prefers-color-scheme: dark) {
                :root {
                    --bg:#121a15;
                    --c: #1b261f;
                    --ink: #e8efe9;
                    --mu: #9bab9f;
                    --ln: #2f3f34;
                    --g: #4fae79
                }
            }

            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font: 16px/1.4 system-ui,sans-serif
            }

            main {
                max-width: 820px;
                margin: auto;
                padding: 12px 12px 90px
            }

            header {
                background: var(--g);
                color: #fff;
                padding: 12px 16px;
                position: sticky;
                top: 0;
                z-index: 5;
                display: flex;
                justify-content: space-between;
                align-items: center
            }

            header b {
                font: 600 18px Georgia,serif
            }

            i {
                font-style: italic;
                color: var(--mu);
                font-size: .85em;
                display: block;
                font-weight: 400
            }

            header i {
                color: #fff;
                opacity: .85
            }

            button {
                font: inherit;
                border: 0;
                border-radius: 8px;
                padding: 12px 16px;
                background: var(--g);
                color: #fff;
                font-weight: 600;
                cursor: pointer
            }

            button.o {
                background: none;
                border: 1px solid var(--ln);
                color: var(--ink)
            }

            section {
                background: var(--c);
                border: 1px solid var(--ln);
                border-radius: 10px;
                padding: 14px;
                margin: 14px 0
            }

            h2 {
                font: 600 19px Georgia,serif;
                margin: 0 0 10px;
                color: var(--g)
            }

            .it {
                border-top: 1px solid var(--ln);
                padding: 12px 0
            }

            .ab {
                display: flex;
                gap: 8px;
                margin: 8px 0
            }

            .ab button {
                flex: 1;
                background: none;
                border: 2px solid var(--ln);
                color: var(--ink)
            }

            .ab button.C.on {
                background: var(--ok);
                border-color: var(--ok);
                color: #fff
            }

            .ab button.NC.on {
                background: var(--nc);
                border-color: var(--nc);
                color: #fff
            }

            .ab button.on i {
                color: #fff
            }

            label {
                display: block;
                margin: 8px 0 2px;
                font-size: 14px
            }

            input,textarea,select {
                width: 100%;
                font: inherit;
                padding: 10px;
                border: 1px solid var(--ln);
                border-radius: 8px;
                background: var(--bg);
                color: var(--ink)
            }

            textarea {
                min-height: 60px
            }

            .g2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0 12px
            }

            @media(max-width: 560px) {
                .g2 {
                    grid-template-columns:1fr
                }
            }

            .bar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: var(--c);
                border-top: 1px solid var(--ln);
                padding: 8px 12px;
                display: flex;
                gap: 8px;
                align-items: center;
                z-index: 5
            }

            .bar>div {
                flex: 1;
                font-size: 13px
            }

            .pg {
                height: 6px;
                background: var(--ln);
                border-radius: 3px;
                overflow: hidden
            }

            .pg span {
                display: block;
                height: 100%;
                background: var(--g)
            }

            .row {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                align-items: center;
                padding: 12px 0;
                border-top: 1px solid var(--ln)
            }

            .tag {
                font-size: 12px;
                padding: 2px 8px;
                border-radius: 99px;
                border: 1px solid var(--ln);
                display: inline-block
            }

            .tag.synced {
                color: var(--ok)
            }

            .tag.pending {
                color: #a66300
            }

            .ph {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 6px
            }

            .ph div {
                position: relative
            }

            .ph img {
                width: 96px;
                height: 96px;
                object-fit: cover;
                border-radius: 8px
            }

            .ph button {
                position: absolute;
                top: 2px;
                right: 2px;
                padding: 2px 8px;
                background: #b3261e
            }

            canvas.sg {
                display: block;
                width: 100%;
                height: 140px;
                border: 1px dashed var(--ln);
                border-radius: 8px;
                background: #fff;
                touch-action: none
            }

            .rr {
                border-top: 1px solid var(--ln);
                padding: 10px 0
            }
        </style>
    </head>
    <body>
        <header>
            <div>
                <b>SPG Ronono</b>
                <i>Système participatif de garantie – Lait</i>
            </div>
            <button class="o" id="cfg" style="color:#fff;border-color:#fff8">⚙</button>
        </header>
        <main id="app"></main>
        <script src="form.js"></script>
        <script>
            const $ = s => document.querySelector(s)
              , app = $('#app');
            const ST = {
                get: (k, d) => {
                    try {
                        return JSON.parse(localStorage[k])
                    } catch {
                        return d
                    }
                }
                ,
                set: (k, v) => localStorage[k] = JSON.stringify(v)
            };
            let recs = ST.get('recs', [])
              , cur = null;
            const save = () => ST.set('recs', recs);
            const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;'
            }[c]));
            const uid = () => 'I' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            function home() {
                cur = null;
                app.oninput = app.onchange = app.onclick = null;
                app.innerHTML = `<section><h2>${L('Fitsirihana', 'Inspections')}</h2>
 <button id="new" style="width:100%">+ ${L('Fitsirihana vaovao', 'Nouvelle inspection')}</button>
 <button class="o" id="sync" style="width:100%;margin-top:8px">⟳ ${L('Alefa ny tsy mbola voaray', 'Synchroniser maintenant')}</button>
 <p id="msg" style="color:var(--mu)"></p>
 ${recs.length ? recs.slice().reverse().map(r => `<div class="row"><div><b>${esc(r.h.eleveur || '(tsy misy anarana)')}</b><i>${esc(r.h.date || '')} · ${esc(r.h.faritra || '')}</i></div>
 <div><span class="tag ${r.status}">${{
                    draft: 'Rakitra • Brouillon',
                    pending: 'Miandry • En attente',
                    synced: 'Voaray • Envoyé'
                }[r.status]}</span>
 ${r.status != 'synced' ? `<button class="o" data-e="${r.id}" style="margin-left:6px;padding:6px 10px">✎</button>` : ''}</div></div>`).join('') : `<p style="color:var(--mu)">${L('Mbola tsy misy fitsirihana.', 'Aucune inspection pour le moment.')}</p>`}</section>`;
                $('#new').onclick = () => edit({
                    id: uid(),
                    status: 'draft',
                    h: {
                        date: new Date().toISOString().slice(0, 10),
                        inspecteur: ST.get('me', '')
                    },
                    a: {},
                    o: {},
                    x: {},
                    r: {},
                    c: {}
                });
                $('#sync').onclick = () => flush(true);
                app.querySelectorAll('[data-e]').forEach(b => b.onclick = () => edit(recs.find(r => r.id == b.dataset.e)));
            }
            const fld = (path, [k,mg,fr,t], v) => `<label>${L(mg, fr)}</label>${t == 'yn' ? `<select data-p="${path}.${k}"><option value="">—</option><option ${v == 'Eny' ? 'selected' : ''} value="Eny">Eny / oui</option><option ${v == 'Tsia' ? 'selected' : ''} value="Tsia">Tsia / non</option></select>` : `<input type="${t}" data-p="${path}.${k}" value="${esc(v)}">`}`;
            function edit(r) {
                cur = r;
                r.rp = r.rp || {
                    date: '',
                    rows: []
                };
                r.sig = r.sig || {};
                r.p = r.p || [];
                app.innerHTML = `<section><h2>${L('Mombamomba ny fitsirihana', 'Identification')}</h2><div class="g2">${HEAD.map(f => `<div>${fld('h', f, r.h[f[0]])}</div>`).join('')}</div>
 <button class="o" id="gps" style="margin-top:12px">📍 ${L('Alaina ny toerana GPS', 'Capturer la position GPS')}</button> <span id="gpsv">${r.gps ? r.gps.lat.toFixed(5) + ', ' + r.gps.lng.toFixed(5) : ''}</span></section>` + rappel() + FORM.map(s => `<section><h2>${s.id}. ${L(s.mg, s.fr)}</h2>${s.it.map( ([ref,mg,fr,xs=[]]) => {
                    const info = ref.endsWith('.0');
                    return `<div class="it"><b>${ref}</b> ${mg}<i>${fr}</i>
  ${info ? '' : `<div class="ab"><button class="C ${r.a[ref] == 'C' ? 'on' : ''}" data-a="${ref}" data-v="C">A <i>C</i></button><button class="NC ${r.a[ref] == 'NC' ? 'on' : ''}" data-a="${ref}" data-v="NC">TA <i>NC</i></button></div>`}
  <div class="g2">${xs.map(f => `<div>${fld('x.' + ref, f, (r.x[ref] || {})[f[0]])}</div>`).join('')}</div>
  <label>${L('Fanamarihana', 'Observations')}</label><textarea data-p="o.${ref}">${esc(r.o[ref])}</textarea></div>`
                }
                ).join('')}
  <label><b>${L('Torolalana sy teboka tokony arahina', 'Recommandations et points à suivre')}</b></label><textarea data-p="r.${s.id}">${esc(r.r[s.id])}</textarea></section>`).join('') + `<section><h2>${L('Fehin-kevitra', 'Conclusions')}</h2>${CONCL.map( ([k,mg,fr]) => `<label>${L(mg, fr)}</label><textarea data-p="c.${k}">${esc(r.c[k])}</textarea>`).join('')}</section>
 ${photosSig()}<div class="bar"><button class="o" id="back">←</button><div><span id="pt"></span><div class="pg"><span id="pb"></span></div></div><button class="o" id="sv">${L('Tehirizo', 'Brouillon')}</button><button id="go">${L('Alefa', 'Envoyer')}</button></div>`;
                app.oninput = app.onchange = e => {
                    const t = e.target.dataset;
                    if (e.target.type == 'file') {
                        if (e.type == 'change')
                            addPhotos(e.target);
                        return
                    }
                    if (t.rr !== undefined) {
                        cur.rp.rows[t.rr][t.rf] = e.target.value;
                        persist();
                        return
                    }
                    if (t.rpd !== undefined) {
                        cur.rp.date = e.target.value;
                        persist();
                        return
                    }
                    const p = t.p;
                    if (!p)
                        return;
                    const [a,b,c] = p.split('.');
                    if (c) {
                        (cur[a][b] = cur[a][b] || {})[c] = e.target.value
                    } else
                        cur[a][b] = e.target.value;
                    persist()
                }
                ;
                app.onclick = e => {
                    const x = e.target.closest('[data-add],[data-del],[data-clr],[data-dp]');
                    if (x) {
                        const d = x.dataset;
                        if (d.add !== undefined) {
                            cur.rp.rows.push({
                                ref: '',
                                crit: '',
                                st: '',
                                obs: ''
                            });
                            rrows()
                        } else if (d.del !== undefined) {
                            cur.rp.rows.splice(d.del, 1);
                            rrows()
                        } else if (d.clr)
                            clearSig(d.clr);
                        else if (d.dp)
                            delPhoto(d.dp);
                        persist();
                        return
                    }
                    const b = e.target.closest('[data-a]');
                    if (!b)
                        return;
                    const R = b.dataset.a;
                    cur.a[R] = cur.a[R] == b.dataset.v ? '' : b.dataset.v;
                    b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', cur.a[R] == x.dataset.v));
                    persist()
                }
                ;
                $('#gps').onclick = () => navigator.geolocation.getCurrentPosition(p => {
                    cur.gps = {
                        lat: p.coords.latitude,
                        lng: p.coords.longitude
                    };
                    $('#gpsv').textContent = cur.gps.lat.toFixed(5) + ', ' + cur.gps.lng.toFixed(5);
                    persist()
                }
                , () => alert('GPS tsy azo • GPS indisponible'), {
                    enableHighAccuracy: true
                });
                initExtras();
                $('#back').onclick = $('#sv').onclick = () => {
                    persist();
                    home()
                }
                ;
                $('#go').onclick = () => {
                    const miss = scored().filter(k => !cur.a[k]);
                    if (!cur.h.eleveur || !cur.h.inspecteur)
                        return alert('Soraty ny anaran’ny mpiompy sy ny mpitsirika.\nRenseigner éleveur et inspecteur.');
                    if (!cur.sig.inspecteur && !confirm('Tsy mbola nisy sonia ny mpitsirika. Alefa ihany?\nSignature de l’inspecteur manquante. Envoyer quand même ?'))
                        return;
                    if (miss.length && !confirm(`${miss.length} teboka tsy voavaly (${miss.slice(0, 6).join(', ')}…). Alefa ihany?\nPoints non renseignés. Envoyer quand même ?`))
                        return;
                    cur.status = 'pending';
                    persist();
                    ST.set('me', cur.h.inspecteur);
                    home();
                    flush()
                }
                ;
                persist();
            }
            const rappel = () => `<section><h2>${L('Fampahatsiahivana ireo teboka tokony harahina taorian’ny fanaraha-maso teo aloha', 'Rappel de points à suivre suite aux précédentes inspections')}</h2><label>${L('Datin’ny fitsirihana teo aloha', 'Date de l’inspection précédente')}</label><input type="date" data-rpd value="${esc(cur.rp.date)}"><div id="rr"></div><button class="o" data-add style="margin-top:10px">+ ${L('Hanampy andalana', 'Ajouter une ligne')}</button></section>`;
            function rrows() {
                $('#rr').innerHTML = cur.rp.rows.map( (w, i) => `<div class="rr"><div class="g2"><div><label>${L('Tondro', 'Réf.')}</label><input data-rr="${i}" data-rf="ref" value="${esc(w.ref)}"></div><div><label>${L('Fanarahana', 'Statut')}</label><select data-rr="${i}" data-rf="st"><option value="">—</option><option value="C" ${w.st == 'C' ? 'selected' : ''}>A • C</option><option value="NC" ${w.st == 'NC' ? 'selected' : ''}>TA • NC</option></select></div></div><label>${L('Fepetra / lafiny arahina sy jerena', 'Critère / point contrôlé')}</label><textarea data-rr="${i}" data-rf="crit">${esc(w.crit)}</textarea><label>${L('Fanamarihana sy fanehoan-kevitra', 'Observation et commentaires')}</label><textarea data-rr="${i}" data-rf="obs">${esc(w.obs)}</textarea><button class="o" data-del="${i}" style="margin-top:6px">✕ ${L('Fafao', 'Supprimer')}</button></div>`).join('')
            }
            const photosSig = () => `<section><h2>${L('Sary porofo ankapobeny', 'Photos du constat général')}</h2>${PK.map( ([k,mg,fr]) => `<div class="it"><b>${mg}</b><i>${fr}</i><div class="ph" id="ph_${k}"></div><input type="file" accept="image/*" multiple data-k="${k}" style="margin-top:8px"></div>`).join('')}</section><section><h2>${L('Sonia', 'Signatures')}</h2>${SGN.map( ([k,mg,fr]) => `<label>${L(mg, fr)}</label><canvas class="sg" data-s="${k}"></canvas><button class="o" data-clr="${k}" style="margin-top:4px">${L('Fafao', 'Effacer')}</button>`).join('')}</section>`;
            const idb = new Promise( (ok, ko) => {
                const q = indexedDB.open('spg', 1);
                q.onupgradeneeded = () => q.result.createObjectStore('ph');
                q.onsuccess = () => ok(q.result);
                q.onerror = ko
            }
            );
            const ph = (m, ...a) => idb.then(d => new Promise( (ok, ko) => {
                const s = d.transaction('ph', m == 'get' ? 'readonly' : 'readwrite').objectStore('ph');
                const q = s[m](...a);
                q.onsuccess = () => ok(q.result);
                q.onerror = ko
            }
            ));
            const shrink = f => new Promise( (ok, ko) => {
                const im = new Image()
                  , u = URL.createObjectURL(f);
                im.onload = () => {
                    const s = Math.min(1, 900 / Math.max(im.width, im.height))
                      , c = document.createElement('canvas');
                    c.width = im.width * s;
                    c.height = im.height * s;
                    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(u);
                    ok(c.toDataURL('image/jpeg', .6))
                }
                ;
                im.onerror = ko;
                im.src = u
            }
            );
            async function addPhotos(inp) {
                const k = inp.dataset.k;
                for (const f of inp.files) {
                    const id = uid();
                    await ph('put', await shrink(f), id);
                    cur.p.push({
                        id,
                        k
                    })
                }
                inp.value = '';
                persist();
                renderPh(k)
            }
            async function renderPh(k) {
                const b = $('#ph_' + k);
                if (!b)
                    return;
                b.innerHTML = (await Promise.all(cur.p.filter(x => x.k == k).map(async x => `<div><img src="${await ph('get', x.id)}"><button data-dp="${x.id}">✕</button></div>`))).join('')
            }
            function delPhoto(id) {
                const x = cur.p.find(p => p.id == id);
                cur.p = cur.p.filter(p => p.id != id);
                ph('delete', id);
                renderPh(x.k)
            }
            function clearSig(k) {
                const c = document.querySelector(`canvas[data-s=${k}]`)
                  , x = c.getContext('2d');
                x.fillStyle = '#fff';
                x.fillRect(0, 0, c.width, 140);
                delete cur.sig[k]
            }
            function initExtras() {
                rrows();
                PK.forEach( ([k]) => renderPh(k));
                document.querySelectorAll('canvas.sg').forEach(c => {
                    const k = c.dataset.s;
                    c.width = c.clientWidth || 320;
                    c.height = 140;
                    const x = c.getContext('2d');
                    x.fillStyle = '#fff';
                    x.fillRect(0, 0, c.width, 140);
                    x.lineWidth = 2.5;
                    x.lineCap = 'round';
                    x.strokeStyle = '#000';
                    if (cur.sig[k]) {
                        const im = new Image();
                        im.onload = () => x.drawImage(im, 0, 0, c.width, 140);
                        im.src = cur.sig[k]
                    }
                    let d = 0;
                    const pt = e => {
                        const r = c.getBoundingClientRect();
                        return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * 140 / r.height]
                    }
                    ;
                    c.onpointerdown = e => {
                        d = 1;
                        c.setPointerCapture(e.pointerId);
                        const [a,b] = pt(e);
                        x.beginPath();
                        x.moveTo(a, b)
                    }
                    ;
                    c.onpointermove = e => {
                        if (!d)
                            return;
                        d = 2;
                        const [a,b] = pt(e);
                        x.lineTo(a, b);
                        x.stroke()
                    }
                    ;
                    c.onpointerup = () => {
                        if (d == 2) {
                            cur.sig[k] = c.toDataURL('image/png');
                            persist()
                        }
                        d = 0
                    }
                }
                )
            }
            function persist() {
                if (!recs.includes(cur))
                    recs.push(cur);
                cur.updated = Date.now();
                save();
                const n = scored().length
                  , d = scored().filter(k => cur.a[k]).length;
                if ($('#pt')) {
                    $('#pt').textContent = `${d}/${n}`;
                    $('#pb').style.width = 100 * d / n + '%'
                }
            }
            async function flush(v) {
                const key = ST.get('key', '');
                if (!key) {
                    if (v)
                        alert('Ampidiro ny kaody ao amin’ny ⚙ • Saisir le code dans ⚙');
                    return
                }
                let ok = 0
                  , ko = 0;
                for (const r of recs.filter(r => r.status == 'pending')) {
                    try {
                        const H = {
                            'x-key': key,
                            'content-type': 'application/json'
                        };
                        r.pu = r.pu || [];
                        for (const p of (r.p || []).filter(p => !r.pu.includes(p.id))) {
                            const d = await ph('get', p.id);
                            if (!d)
                                continue;
                            const y = await fetch('/api/photos', {
                                method: 'POST',
                                headers: H,
                                body: JSON.stringify({
                                    id: p.id,
                                    insp: r.id,
                                    kind: p.k,
                                    data: d
                                })
                            });
                            if (!y.ok)
                                throw 0;
                            r.pu.push(p.id)
                        }
                        const x = await fetch('/api/inspections', {
                            method: 'POST',
                            headers: H,
                            body: JSON.stringify(r)
                        });
                        if (x.ok) {
                            r.status = 'synced';
                            ok++;
                            (r.p || []).forEach(p => ph('delete', p.id))
                        } else
                            ko++
                    } catch {
                        ko++
                    }
                }
                save();
                if (!cur) {
                    home();
                    if (v)
                        $('#msg').textContent = `${ok} voaray • envoyé(s) · ${ko} tsy lasa • en attente`
                }
            }
            $('#cfg').onclick = () => {
                const k = prompt('Kaody mpitsirika • Code inspecteur', ST.get('key', ''));
                if (k !== null)
                    ST.set('key', k.trim())
            }
            ;
            addEventListener('online', () => flush());
            if ('serviceWorker' in navigator)
                navigator.serviceWorker.register('sw.js');
            home();
            flush();
        </script>
    </body>
</html>
